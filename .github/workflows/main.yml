name: Build .NET Framework and C++

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3 # Adds MSBuild.exe to the PATH

    - name: Install ATL/MFC via VS Installer
      shell: powershell
      run: |
        Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
        
        $Arguments = @(
          'modify',
          '--allInstallations',
          '--add', 'Microsoft.VisualStudio.Component.VC.ATLMFC',
          '--quiet',
          '--norestart',
          '--nocache'
        )
        
        Write-Host "Starting dynamic Visual Studio Installer configuration..."
        $process = Start-Process -FilePath ".\vs_installer.exe" -ArgumentList $Arguments -Wait -PassThru -WindowStyle Hidden
        
        # VS Installer returns 0 for success, 3010 for success but reboot required.
        if ($process.ExitCode -eq 0 -or $process.ExitCode -eq 3010) {
            Write-Host "ATL/MFC component successfully added!"
        } else {
            Write-Error "VS Installer failed with exit code: $($process.ExitCode)"
            exit 1
        }

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2 # Ensures NuGet is available

    - name: Restore NuGet Packages
      run: nuget restore JumpSpaceBalance.slnx

    - name: Build Solution in Release (Melon)
      run: msbuild JumpSpaceBalance.slnx /p:Configuration=Release

    - name: Build Solution in Release_Standalone
      run: msbuild JumpSpaceBalance.slnx /p:Configuration=Release_Standalone

    - name: Upload Binaries in Release (Melon)
      uses: actions/upload-artifact@v4
      with:
        name: jumpspacebalance_melon
        path: out\Release\

    - name: Upload Binaries in Release_Standalone
      uses: actions/upload-artifact@v4
      with:
        name: jumpspacebalance_standalone
        path: out\Release_Standalone\
